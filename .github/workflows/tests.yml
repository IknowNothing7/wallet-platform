name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs tests for the root wallet service and all services/* subprojects.
      # Testcontainers uses the Docker daemon that ships with ubuntu-latest runners.
      - name: Run tests
        run: ./gradlew test --continue

      # Mutation testing gate for the ledger (thresholds in build.gradle); unit tests only, about half a minute
      - name: Mutation tests (ledger)
        run: ./gradlew pitest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            services/*/build/reports/tests/
            build/reports/pitest/
