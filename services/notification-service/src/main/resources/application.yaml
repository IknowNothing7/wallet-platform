spring:
  application:
    name: notification-service

  # Same Postgres instance as wallet-service locally, but its own schema: the services share no tables
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${NOTIFICATION_DB_USER:myuser}
    password: ${NOTIFICATION_DB_PASSWORD:secret}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notification
    default-schema: notification

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: notification

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        # How often the topic pattern is re-matched. The outbox creates wallet.<aggregate_type> topics on first publish,
        # so with the 5-minute default a fresh stack sees no events for up to 5 minutes
        metadata.max.age.ms: 10000
    listener:
      # Offsets are committed only after the handler's transaction commits
      ack-mode: record
      observation-enabled: true   # continues the trace from the event's traceparent header
    template:
      observation-enabled: true
    # Only used by the DLT publisher: it forwards the record as consumed (String key and value)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${WALLET_JWKS_URI:http://localhost:8080/.well-known/jwks.json}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}   # every request locally; lower it where traffic is real
  opentelemetry:
    tracing:
      export:
        otlp:
          # Jaeger in compose.yaml; service.name in the traces is spring.application.name
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false   # metrics stay on Prometheus; only traces go over OTLP

server:
  port: ${SERVER_PORT:8082}

notification:
  jwks:
    cache-ttl: PT5M               # how long fetched keys are used before they are refetched
    min-refresh-interval: PT30S   # an unknown kid refetches at most this often

  consumer:
    # Every wallet.<aggregate_type> topic the outbox publishes to, but not the <topic>.DLT dead-letter topics
    topic-pattern: wallet\.[a-z_]+
    initial-backoff: PT1S
    max-backoff: PT1M
    max-attempts: 8             # then the record goes to <topic>.DLT
