services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - "5432:5432"
  kafka:
    # Single-node KRaft broker with the image defaults: listener on localhost:9092, topics auto-created.
    # Spring Boot's Docker Compose support detects this image and sets spring.kafka.bootstrap-servers.
    image: 'apache/kafka:latest'
    ports:
      - "9092:9092"
  prometheus:
    image: 'prom/prometheus:v3.5.0'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - './monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
      - './monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro'
    extra_hosts:
      # The app runs on the host; on Linux this name doesn't exist unless mapped
      - 'host.docker.internal:host-gateway'
    ports:
      - "9090:9090"
  grafana:
    image: 'grafana/grafana:12.1.1'
    environment:
      - 'GF_SECURITY_ADMIN_USER=admin'
      - 'GF_SECURITY_ADMIN_PASSWORD=admin'
    volumes:
      - './monitoring/grafana/provisioning:/etc/grafana/provisioning:ro'
      - './monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro'
    depends_on:
      - prometheus
    ports:
      - "3001:3000"   # 3000 is the frontend (app.cors.allowed-origins)
