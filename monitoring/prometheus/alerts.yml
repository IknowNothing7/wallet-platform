groups:
  - name: wallet-deposits
    rules:
      # Raised from code via DepositAlerts.raise(...): any new alert in the last 5 minutes fires this
      - alert: DepositAlert
        expr: increase(wallet_deposit_alerts_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Deposit needs manual review: {{ $labels.reason }}"
          description: >-
            {{ $value | humanize }} deposit alert(s) with reason {{ $labels.reason }} in the last 5 minutes.
            Search the wallet-platform logs for "ALERT [{{ $labels.reason }}]" for deposit ids and bank references.
            UNREADABLE_WEBHOOK: the body is in the bank_webhook_dead_letter table, under the id in the log line.

      # Webhooks are not arriving and reconciliation is not clearing the backlog (bank down, or the job stuck)
      - alert: DepositsStuckPending
        expr: max(wallet_deposit_stale_pending_oldest_seconds) > 600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PENDING deposits not settling"
          description: >-
            The oldest stale PENDING deposit has been waiting {{ $value | humanizeDuration }}.
            Check bank-sim reachability and the "Reconciliation of deposit" warnings in the wallet-platform logs.

      - alert: WalletPlatformDown
        expr: up{job="wallet-platform"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape wallet-platform"
