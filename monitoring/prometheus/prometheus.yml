global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # wallet-platform runs on the host (./gradlew bootRun), not in compose; host.docker.internal is mapped in compose.yaml
  - job_name: wallet-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
