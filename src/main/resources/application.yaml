spring:
  application:
    name: wallet-platform

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

  kafka:
    # Overridden automatically by Docker Compose support in development
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast when the broker is unreachable so the outbox publisher can back off instead of hanging
        max.block.ms: 10000
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000

  task:
    scheduling:
      pool:
        # The outbox publisher can block on Kafka; keep other scheduled jobs (token cleanup etc.) running
        size: 4

app:
  cors:
    # Comma-separated exact origins; set CORS_ALLOWED_ORIGINS to your real frontend domains
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

auth:
  rate-limit:
    ip:
      max-requests: 20   # POSTs to /api/auth/** per client IP per window
      window: PT1M
    login:
      max-failures: 5    # failed logins per email before it is temporarily blocked
      window: PT15M

outbox:
  publisher:
    topic-prefix: wallet.   # events go to wallet.<aggregate_type>, e.g. wallet.transfer
    poll-interval: PT1S
    batch-size: 100
    max-attempts: 10        # non-connectivity failures before an event is marked FAILED
    send-timeout: PT35S     # must exceed delivery.timeout.ms
    initial-backoff: PT1S   # doubles per consecutive failed batch...
    max-backoff: PT5M       # ...up to this

bank:
  base-url: ${BANK_SIM_URL:http://localhost:8081}
  request-timeout: PT5S
  webhook:
    # Shared with bank-sim (BANK_SIM_WEBHOOK_SECRET there); verifies X-Bank-Signature
    secret: ${BANK_SIM_WEBHOOK_SECRET:change-me-local-only}
    # Also accepted while rotating: set it to the old secret, switch bank-sim to the new one, then clear it
    previous-secret: ${BANK_SIM_WEBHOOK_PREVIOUS_SECRET:}
    tolerance: PT5M       # max age of X-Bank-Timestamp, against replays
    max-body-size: 16KB   # a payment result is a few hundred bytes; larger bodies get 413 before being read
    rate-limit:
      max-requests: 600   # per client IP per window; all real webhooks come from bank-sim's one address
      window: PT1M

deposit:
  pending-ttl: PT30M      # PENDING this long: ask the bank once more, then expire
  reconciliation:
    poll-interval: PT30S
    stale-after: PT1M     # PENDING this long without a webhook: ask the bank
    batch-size: 50

hold:
  max-ttl: P7D            # latest expiresAt a merchant may ask for, counted from creation
  expiry:
    poll-interval: PT30S  # how often HoldExpiryJob marks holds past expiresAt as EXPIRED
    batch-size: 100

admin:
  # Creates this ADMIN on startup if no user has the email yet; the only way to get an admin. Leave unset to skip.
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    name: ${ADMIN_NAME:Admin}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus   # all three are permitAll in SecurityConfig
  metrics:
    tags:
      application: ${spring.application.name}   # lets Grafana tell wallet-platform apart from bank-sim etc.

logging:
  level:
    org.flywaydb: DEBUG

jwt:
  # RS256 signing key, PKCS#8 PEM (or just its base64 body). Unset: a key is generated at startup, so tokens don't
  # survive a restart. Generate one with: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048
  private-key: ${JWT_PRIVATE_KEY:}
  lifetime: 3600000
